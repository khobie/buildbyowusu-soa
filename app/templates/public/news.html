{% extends "base.html" %}
{% block title %}News — {{ school_name }}{% endblock %}
{% block content %}
<section class="py-5 bg-medical text-white"><div class="container py-4 text-center"><h1>News & Events</h1></div></section>
<section class="py-5"><div class="container"><div class="row g-4">
{% for article in articles %}
<div class="col-md-4" data-aos="fade-up"><div class="glass-card p-4 h-100"><h5>{{ article.title }}</h5><p class="small text-muted">{{ article.summary or article.content[:120] }}</p><a href="{{ url_for('main.news_detail', slug=article.slug) }}">Read more →</a></div></div>
{% else %}<p class="text-muted">No news articles yet.</p>{% endfor %}
</div></div></section>
{% endblock %}
