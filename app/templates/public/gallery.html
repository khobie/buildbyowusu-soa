{% extends "base.html" %}
{% block title %}Gallery — {{ school_name }}{% endblock %}
{% block content %}
<section class="py-5 bg-medical text-white"><div class="container py-4 text-center"><h1>Gallery</h1></div></section>
<section class="py-5"><div class="container"><div class="row g-3">
{% for img in images %}
<div class="col-md-4"><div class="glass-card overflow-hidden"><img src="{{ url_for('static', filename=img.image_path) }}" class="w-100" style="height:200px;object-fit:cover" alt="{{ img.title }}" loading="lazy"><div class="p-3"><h6>{{ img.title }}</h6></div></div></div>
{% else %}
<div class="col-12 text-center text-muted py-5"><i class="fas fa-images fa-3x mb-3 d-block"></i><p>Gallery images will appear here once uploaded by admin.</p></div>
{% endfor %}
</div></div></section>
{% endblock %}
