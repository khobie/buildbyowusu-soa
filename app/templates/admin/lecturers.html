{% extends "admin/dashboard.html" %}
{% block portal_content %}
<div class="d-flex justify-content-between mb-4"><h2>Lecturers</h2><a href="{{ url_for('admin.add_lecturer') }}" class="btn btn-medical">Add</a></div>
<div class="glass-card p-4"><table class="table"><thead><tr><th>Staff ID</th><th>Name</th><th>Title</th><th>Specialization</th></tr></thead>
<tbody>{% for l in lecturers %}<tr><td>{{ l.staff_id }}</td><td>{{ l.user.full_name }}</td><td>{{ l.title }}</td><td>{{ l.specialization }}</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
