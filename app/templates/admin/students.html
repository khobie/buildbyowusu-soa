{% extends "admin/dashboard.html" %}
{% block portal_content %}
<div class="d-flex justify-content-between mb-4"><h2>Students</h2><a href="{{ url_for('admin.add_student') }}" class="btn btn-medical"><i class="fas fa-plus"></i> Add</a></div>
<div class="glass-card p-4"><table class="table table-hover"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Programme</th><th>Status</th></tr></thead>
<tbody>{% for s in pagination.items %}<tr><td>{{ s.student_id }}</td><td>{{ s.user.full_name }}</td><td>{{ s.user.email }}</td><td>{{ s.programme.name if s.programme else '-' }}</td><td>{{ s.status }}</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
