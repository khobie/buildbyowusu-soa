{% extends "admin/dashboard.html" %}
{% block portal_content %}
<h2>Reports & Export</h2>
<div class="row g-3 mt-3">
    <div class="col-md-4"><div class="glass-card p-4 text-center"><i class="fas fa-file-csv fa-2x text-medical mb-3"></i><h5>Students CSV</h5><a href="{{ url_for('admin.export_students') }}" class="btn btn-medical">Export</a></div></div>
    <div class="col-md-4"><div class="glass-card p-4 text-center"><i class="fas fa-file-csv fa-2x text-medical mb-3"></i><h5>Applications CSV</h5><a href="{{ url_for('admin.export_applications') }}" class="btn btn-medical">Export</a></div></div>
    <div class="col-md-4"><div class="glass-card p-4 text-center"><i class="fas fa-chart-line fa-2x text-emerald mb-3" style="color:#10B981"></i><h5>Dashboard API</h5><a href="{{ url_for('api.stats') }}" class="btn btn-emerald" target="_blank">View JSON</a></div></div>
</div>
{% endblock %}
