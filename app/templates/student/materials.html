{% extends "student/dashboard.html" %}
{% block portal_content %}<h2>Course Materials</h2>
<div class="row g-3 mt-3">{% for m in materials %}
<div class="col-md-6"><div class="glass-card p-3 d-flex justify-content-between align-items-center">
    <div><i class="fas fa-file-pdf text-danger me-2"></i><strong>{{ m.title }}</strong><br><small class="text-muted">{{ m.description[:50] if m.description else '' }}</small></div>
    <a href="{{ url_for('student.download_material', id=m.id) }}" class="btn btn-sm btn-medical"><i class="fas fa-download"></i></a>
</div></div>{% else %}<p class="text-muted">No materials uploaded yet.</p>{% endfor %}</div>
{% endblock %}
