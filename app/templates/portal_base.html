{% extends "base.html" %}
{% block content %}
<div class="d-flex">
    <nav class="portal-sidebar d-none d-md-block" style="width:240px;flex-shrink:0">
        <div class="px-3 mb-4">
            <small class="text-white-50">PORTAL</small>
            <h6 class="text-white mb-0">{{ current_user.full_name }}</h6>
        </div>
        {% block sidebar %}{% endblock %}
    </nav>
    <main class="flex-grow-1 p-4 bg-light" style="min-height:calc(100vh - 56px)">
        {% block portal_content %}{% endblock %}
    </main>
</div>
{% endblock %}
