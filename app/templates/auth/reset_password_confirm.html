{% extends "base.html" %}
{% block content %}
<div class="glass-card auth-card p-4 my-5">
    <h4>Set New Password</h4>
    <form method="POST">{{ form.hidden_tag() }}
        {{ form.password(class="form-control mb-3", placeholder="New password") }}
        {{ form.confirm_password(class="form-control mb-3") }}
        {{ form.submit(class="btn btn-medical w-100") }}
    </form>
</div>
{% endblock %}
